name: Deploy SobrietyChain dApp to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar via GitHub Pages nativo
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo, descartando builds desatualizados
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci || npm install

      - name: Compilar Projeto (Vite Build)
        env:
          VITE_THIRDWEB_CLIENT_ID: ${{ secrets.VITE_THIRDWEB_CLIENT_ID }}
          VITE_EDITION_DROP_ADDRESS: ${{ secrets.VITE_EDITION_DROP_ADDRESS || '0x2Fe5Abb5B7103dF986de19E485Af3ba93E08a080' }}
          VITE_ACTIVE_CHAIN: ${{ secrets.VITE_ACTIVE_CHAIN || 'sepolia' }}
        run: |
          npm run build
          # Adiciona 404.html para suportar roteamento direto no GitHub Pages sem erro 404 ao recarregar
          cp dist/index.html dist/404.html

      - name: Upload Artifact para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
